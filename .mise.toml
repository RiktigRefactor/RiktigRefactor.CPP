[tools]
dotnet = "latest"
cmake = "latest"
ninja = "latest"

# LLVM 18 from conda-forge: the llvm-project release tarballs need libtinfo.so.5 on Linux and have no shared libraries on Windows.
"conda:clangdev" = "18.1.8"
"conda:clang-format" = "18.1.8"

[env]
RIKTIG_LLVM_ROOT = { value = "{{ tools['conda:clangdev'].path }}", tools = true }

[tasks.mdsnippets]
description = "Update snippets and the table of contents in markdown files"
run = ["dotnet tool restore", "dotnet mdsnippets"]

[tasks.build-and-test]
description = "Build and run all tests"
run = [
  "cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug",
  "cmake --build build",
  "ctest --test-dir build --output-on-failure --parallel",
]
