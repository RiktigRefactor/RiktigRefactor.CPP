[tools]
dotnet = "latest"
cmake = "latest"
ninja = "latest"

[tools."github:llvm/llvm-project"]
version = "18.1.8"
version_prefix = "llvmorg-"
bin_path = "bin"

[tools."github:llvm/llvm-project".platforms]
linux-x64 = { asset_pattern = "clang?llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz" }
linux-arm64 = { asset_pattern = "clang?llvm-18.1.8-aarch64-linux-gnu.tar.xz" }
macos-arm64 = { asset_pattern = "clang?llvm-18.1.8-arm64-apple-macos11.tar.xz" }
windows-x64 = { asset_pattern = "clang?llvm-18.1.8-x86_64-pc-windows-msvc.tar.xz" }

[env]
RIKTIG_LLVM_ROOT = { value = "{{ tools['github:llvm/llvm-project'].path }}", tools = true }

[tasks.mdsnippets]
description = "Update snippets and the table of contents in markdown files"
run = ["dotnet tool restore", "dotnet mdsnippets"]

[tasks.build-and-test]
description = "Build and run all tests"
run = [
  "cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug",
  "cmake --build build",
  "ctest --test-dir build --output-on-failure --parallel",
]
