name: Release

# Every push to main publishes a GitHub prerelease: v<VERSION file>-main.<run number>.
# A real release is started by hand: Actions > Release > Run workflow, with a version such as 1.2.3
# (or: gh workflow run release.yml -f version=1.2.3). It tags v<version> and publishes a non-prerelease.
# LLVM and clang are linked statically, so each archive runs without them installed.
on:
  push:
    # static-release is temporary, for proving the static builds; publishing only happens from main.
    branches: [main, static-release]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 1.2.3 (leave empty for a prerelease)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-slim
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - name: Compute version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            if ! [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Version must look like 1.2.3" >&2; exit 1
            fi
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(tr -d '[:space:]' < VERSION)-main.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 sets the glibc floor of the Linux archives.
          - runner: ubuntu-22.04
            os: linux
            arch: x64
            cpack: TGZ
            ext: tar.gz
          - runner: ubuntu-22.04-arm
            os: linux
            arch: arm64
            cpack: TGZ
            ext: tar.gz
          - runner: windows-2025
            os: windows
            arch: x64
            vcarch: x64
            cpack: ZIP
            ext: zip
          - runner: windows-11-arm
            os: windows
            arch: arm64
            vcarch: arm64
            cpack: ZIP
            ext: zip
          - runner: macos-latest
            os: macos
            arch: arm64
            cpack: TGZ
            ext: tar.gz
          - runner: macos-15-intel
            os: macos
            arch: x64
            cpack: TGZ
            ext: tar.gz
    name: build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - name: Visual Studio environment (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          VCARCH: ${{ matrix.vcarch }}
        run: ./.github/scripts/import-msvc-env.ps1
      - name: Static zlib and zstd (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y zlib1g-dev libzstd-dev zstd
      - name: Static zlib and zstd (Windows)
        if: matrix.os == 'windows'
        shell: bash
        env:
          VCPKG_COMMIT: 9eec002df1cd109f8f104cd966a763daf9751489 # 2026.10.16
          TRIPLET: ${{ matrix.vcarch }}-windows-static
        run: |
          git init -q vcpkg
          git -C vcpkg fetch -q --depth 1 https://github.com/microsoft/vcpkg "$VCPKG_COMMIT"
          git -C vcpkg checkout -q FETCH_HEAD
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          ./vcpkg/vcpkg install --triplet "$TRIPLET" zlib zstd
          echo "RIKTIG_DEPS_PREFIX=$(cygpath -m "$PWD/vcpkg/installed/$TRIPLET")" >> "$GITHUB_ENV"
      - name: Restore static LLVM (macOS)
        id: llvm-cache
        if: matrix.os == 'macos'
        uses: actions/cache/restore@v4
        with:
          path: static-llvm
          key: static-llvm-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('.github/scripts/fetch-static-llvm', '.mise.toml') }}-${{ env.MACOSX_DEPLOYMENT_TARGET }}
      - name: Fetch static LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        shell: bash
        run: mise exec -- bash ./.github/scripts/fetch-static-llvm ${{ matrix.os }} ${{ matrix.arch }} static-llvm
      - name: Save static LLVM (macOS)
        if: matrix.os == 'macos' && steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: static-llvm
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}
      - name: Build and test with static LLVM
        shell: bash
        run: |
          llvm=$PWD/static-llvm
          compiler=()
          exe=
          if [ "${{ matrix.os }}" = windows ]; then
            llvm=$(cygpath -m "$llvm")
            exe=.exe
            compiler=(-DCMAKE_CXX_COMPILER="$llvm/bin/clang-cl.exe")
          fi
          if [ "${{ matrix.os }}" = macos ]; then export SDKROOT=$(xcrun --show-sdk-path); fi
          mise exec -- cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DRIKTIG_STATIC_LLVM=ON \
            -DCMAKE_PREFIX_PATH="$llvm;${RIKTIG_DEPS_PREFIX:-}" -DClang_DIR="$llvm/lib/cmake/clang" -DLLVM_DIR="$llvm/lib/cmake/llvm" \
            -DRIKTIG_CLANGXX="$llvm/bin/clang++$exe" "${compiler[@]}" -DRIKTIG_PACKAGE_VERSION="$VERSION"
          mise exec -- cmake --build build-release
          mise exec -- ctest --test-dir build-release --output-on-failure --parallel
      - name: Build release archive
        shell: bash
        run: |
          mise exec -- cpack --config build-release/CPackConfig.cmake -G ${{ matrix.cpack }} -B dist
          mv dist/riktig-cpp-*.${{ matrix.ext }} "dist/riktig-cpp-$VERSION-${{ matrix.os }}-${{ matrix.arch }}.${{ matrix.ext }}"
      - name: Smoke test the unpacked archive
        shell: bash
        run: |
          mkdir smoke
          if [ "${{ matrix.ext }}" = zip ]; then
            unzip -q dist/riktig-cpp-*.zip -d smoke
          else
            tar -xzf dist/riktig-cpp-*.tar.gz -C smoke
          fi
          # With no arguments the tool prints its usage and exits 2.
          set +e
          output=$(smoke/*/bin/riktig-cpp* 2>&1)
          status=$?
          set -e
          echo "$output" | head -n 3
          case "${{ matrix.os }}" in
            linux) ldd smoke/*/bin/riktig-cpp ;;
            macos) otool -L smoke/*/bin/riktig-cpp ;;
            windows) dumpbin -nologo -dependents smoke/*/bin/riktig-cpp.exe ;;
          esac
          if [ "$status" -ne 2 ] || ! grep -q "Usage:" <<< "$output"; then
            echo "Unpacked riktig-cpp did not run" >&2; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: riktig-cpp-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  publish:
    needs: [version, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: v${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: riktig-cpp-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        run: |
          flags=(--target "$GITHUB_SHA" --title "$TAG" --generate-notes)
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" dist/* "${flags[@]}"
