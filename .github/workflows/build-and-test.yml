name: Build and Test

on:
  push:
  pull_request:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install clang 18 and its development libraries
        run: sudo apt-get update && sudo apt-get install -y clang-18 clang-format-18 libclang-18-dev llvm-18-dev cmake ninja-build
      - run: ./build-and-test
        shell: bash
